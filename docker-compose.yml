# The whole GreyPDF stack. Copy .env.docker.example to .env, fill it in, then:
#   docker compose up --build -d
#
# The worker opens files from strangers, so it sits on the `internal` network,
# which has no route to the internet. A document can't call out or fetch
# anything, even if it tries.

x-backend: &backend
  build: ./backend
  restart: unless-stopped
  environment: &backend-env
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    DEBUG: ${DEBUG:-False}
    ENVIRONMENT: ${ENVIRONMENT:-production}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
    TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
    ADMIN_URL: ${ADMIN_URL:-admin}
    DB_NAME: greypdf
    DB_USER: greypdf
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    DB_HOST: db
    DB_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
  volumes:
    - media:/app/media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: greypdf
      POSTGRES_USER: greypdf
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greypdf"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    restart: "no"
    command: ["python", "manage.py", "migrate", "--noinput"]
    networks: [internal]

  web:
    <<: *backend
    ports:
      - "${API_PORT:-8000}:8000"
    networks: [internal, public]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command:
      - celery
      - -A
      - config
      - worker
      - --loglevel=info
      - --concurrency=2
      - --max-tasks-per-child=50
    networks: [internal]
    depends_on:
      migrate:
        condition: service_completed_successfully
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 3g
    pids_limit: 512
    tmpfs:
      - /tmp:size=2g,exec

  beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    networks: [internal]
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks: [public]

networks:
  internal:
    internal: true
  public:

volumes:
  postgres:
  media:
