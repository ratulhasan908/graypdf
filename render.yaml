# Render Blueprint: the GreyPDF API on Render's free plan. The website runs on
# Vercel and the database on Neon. In Render: New + > Blueprint > this repo.
services:
  - type: web
    name: greypdf-api
    runtime: docker
    plan: free
    region: virginia # next to the Neon database (AWS us-east-1)
    dockerfilePath: ./deploy/single/Dockerfile
    dockerContext: ./backend
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL # Neon connection string, without pooling
        sync: false
      - key: ADMIN_URL # secret admin path, e.g. manage-xxxxxxxxxx
        sync: false
      - key: DEBUG
        value: "False"
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_HOSTS
        value: localhost
      - key: CORS_ALLOWED_ORIGINS
        value: https://greypdf.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://greypdf.vercel.app
      - key: TRUSTED_PROXY_COUNT
        value: "0"
      # 512 MB of RAM: one web process, one job at a time, one OCR page at a time.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: CELERY_POOL
        value: solo
      - key: CELERY_CONCURRENCY
        value: "1"
      - key: OCR_JOBS
        value: "1"
